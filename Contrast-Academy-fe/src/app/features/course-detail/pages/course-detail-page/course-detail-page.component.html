<div class="min-h-screen bg-neutral-900 pb-12" *ngIf="course">

    <!-- Navbar -->
    <app-navbar></app-navbar>

    <!-- Page Content -->
    <div class="px-6 pt-10">

        <!-- Back Button -->
        <div class="max-w-5xl mx-auto mb-8">
            <button (click)="goBack()"
                class="flex items-center gap-2 text-sm text-white/50 hover:text-white transition-colors duration-200">
                <span class="text-lg">←</span>
                <span>Back to Courses</span>
            </button>
        </div>

        <!-- Hero Section -->
        <app-course-detail-hero-section [course]="course"></app-course-detail-hero-section>

        <!-- Modules Section -->
        <app-course-detail-modules-section [course]="course"></app-course-detail-modules-section>

        <!-- Prerequisites Section -->
        <app-course-prerequisites-section [course]="course"></app-course-prerequisites-section>

        <!-- Enroll CTA -->
        <app-course-enroll-cta [course]="course"></app-course-enroll-cta>

    </div>

</div>
