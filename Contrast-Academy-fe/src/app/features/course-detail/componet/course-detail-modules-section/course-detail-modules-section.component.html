<div class="max-w-5xl mx-auto mb-8">
    <h2 class="text-2xl font-bold text-white mb-6 tracking-wide">📚 Course Modules</h2>

    <div class="space-y-4">
        <div *ngFor="let module of course.modules; let i = index" class="rounded-2xl border border-white/10 bg-[#0F172A] p-6
                            hover:border-blue-500/30 hover:shadow-[0_4px_20px_rgba(59,130,246,0.1)]
                            transition-all duration-300">
            <div class="flex items-start gap-4">
                <!-- Module Number -->
                <div class="w-10 h-10 flex items-center justify-center rounded-full
                                    bg-gradient-to-br from-blue-500 to-blue-600 text-white
                                    font-bold text-sm shrink-0">
                    {{ i + 1 }}
                </div>
                <!-- Module Details -->
                <div class="flex-1">
                    <h3 class="text-lg font-bold text-white">{{ module.title }}</h3>
                    <p class="text-sm text-white/50 mt-1">{{ module.description }}</p>
                </div>
                <!-- Lessons Count -->
                <span class="text-xs font-bold text-blue-400 bg-blue-500/10 px-3 py-1.5
                                     rounded-full border border-blue-500/20 shrink-0">
                    {{ module.lessons }} Lessons
                </span>
            </div>
        </div>
    </div>
</div>
