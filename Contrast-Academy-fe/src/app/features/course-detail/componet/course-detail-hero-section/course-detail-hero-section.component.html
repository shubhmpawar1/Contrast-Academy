<div class="max-w-5xl mx-auto rounded-2xl border border-white/10 bg-[#0F172A] p-8 md:p-12 mb-8">
    <div class="flex flex-col md:flex-row md:items-center gap-6">
        <!-- Icon -->
        <div class="w-20 h-20 flex items-center justify-center rounded-2xl bg-[#111C33] text-4xl shrink-0">
            {{ course.icon }}
        </div>
        <!-- Title & Meta -->
        <div class="flex-1">
            <h1 class="text-3xl md:text-4xl font-bold text-white tracking-wide">
                {{ course.title }}
            </h1>
            <p class="text-blue-400 text-lg mt-1 font-medium">
                {{ course.subtitle }}
            </p>
            <p class="text-white/60 mt-3 leading-relaxed max-w-2xl">
                {{ course.description }}
            </p>
        </div>
    </div>

    <!-- Stats Row -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-8">
        <!-- Duration -->
        <div class="rounded-xl border border-white/10 bg-[#111C33] p-4 text-center">
            <p class="text-2xl font-bold text-white">{{ course.duration }}</p>
            <p class="text-xs text-white/40 mt-1 uppercase tracking-widest">Duration</p>
        </div>
        <!-- Level -->
        <div class="rounded-xl border border-white/10 bg-[#111C33] p-4 text-center">
            <p class="text-2xl font-bold text-white">{{ course.level }}</p>
            <p class="text-xs text-white/40 mt-1 uppercase tracking-widest">Level</p>
        </div>
        <!-- Lessons -->
        <div class="rounded-xl border border-white/10 bg-[#111C33] p-4 text-center col-span-2 md:col-span-1">
            <p class="text-2xl font-bold text-white">{{ course.totalLessons }}</p>
            <p class="text-xs text-white/40 mt-1 uppercase tracking-widest">Total Lessons</p>
        </div>
    </div>
</div>
