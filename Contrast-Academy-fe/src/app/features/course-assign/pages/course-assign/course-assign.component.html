<app-navbar></app-navbar>
<div class="min-h-screen bg-gray-100 flex items-center justify-center">
    <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-6">

        <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
            Assign Course
        </h2>

        <form (ngSubmit)="assignCourse()" class="space-y-4">

            <!-- Student Dropdown -->
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">
                    Select Student
                </label>
                <select [(ngModel)]="selectedStudentId" name="student" required
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="" disabled selected>Select student</option>
                    <option *ngFor="let student of students" [value]="student.id">
                        {{ student.name }} ({{ student.email }})
                    </option>
                </select>
            </div>

            <!-- Course Dropdown -->
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">
                    Select Course
                </label>
                <select [(ngModel)]="selectedCourseId" name="course" required
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="" disabled selected>Select course</option>
                    <option *ngFor="let course of courses" [value]="course.id">
                        {{ course.title }}
                    </option>
                </select>
            </div>

            <!-- Button -->
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                Assign Course
            </button>

        </form>

    </div>
</div>
