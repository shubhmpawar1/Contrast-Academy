<div class="bg-blue-600/5 border border-blue-500/10 rounded-2xl p-6 space-y-6 sticky top-24">
    <div class="space-y-2">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <span>🧠</span> Quick Quiz
        </h2>
        <p class="text-slate-400 text-sm leading-relaxed">
            {{ lesson.quiz.question }}
        </p>
    </div>

    <div class="space-y-3">
        <label *ngFor="let option of lesson.quiz.options"
            (click)="selectOption(option)"
            [ngClass]="{
                'border-blue-500 bg-blue-500/10': selectedOption === option && !isSubmitted,
                'border-green-500 bg-green-500/10': isSubmitted && option === lesson.quiz.correctAnswer,
                'border-red-500 bg-red-500/10': isSubmitted && selectedOption === option && option !== lesson.quiz.correctAnswer,
                'opacity-50 cursor-not-allowed': isSubmitted && option !== lesson.quiz.correctAnswer && option !== selectedOption,
                'cursor-pointer hover:bg-white/[0.05]': !isSubmitted
            }"
            class="flex items-center gap-3 p-4 rounded-xl border border-white/5 bg-white/[0.02] hover:border-blue-500/30 transition-all group relative">
            <input type="radio" name="quiz" 
                [checked]="selectedOption === option"
                [disabled]="isSubmitted"
                class="w-4 h-4 accent-blue-500">
            <span class="text-sm transition-colors"
                [ngClass]="{
                    'text-white': selectedOption === option,
                    'text-slate-300': selectedOption !== option
                }">
                {{ option }}
            </span>

            <!-- Result Icons -->
            <ng-container *ngIf="isSubmitted">
                <span *ngIf="option === lesson.quiz.correctAnswer" class="ml-auto text-green-500">✅</span>
                <span *ngIf="selectedOption === option && option !== lesson.quiz.correctAnswer" class="ml-auto text-red-500">❌</span>
            </ng-container>
        </label>
    </div>

    <!-- Alert Message -->
    <div *ngIf="isSubmitted" 
         class="p-4 rounded-xl text-center text-sm font-bold border"
         [ngClass]="isCorrect ? 'bg-green-500/10 text-green-400 border-green-500/20' : 'bg-red-500/10 text-red-400 border-red-500/20'">
        {{ isCorrect ? '🎉 Correct Answer! Great job!' : '😔 Incorrect. The correct answer was: ' + lesson.quiz.correctAnswer }}
    </div>

    <button *ngIf="!isSubmitted"
        (click)="submitAnswer()"
        [disabled]="!selectedOption"
        [ngClass]="{'opacity-50 cursor-not-allowed': !selectedOption}"
        class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm shadow-lg shadow-blue-500/20 transition-all active:scale-95">
        Submit Answer
    </button>
</div>
