<div class="min-h-screen bg-[#020617] pb-20" *ngIf="lesson">
    <app-navbar></app-navbar>

    <div class="max-w-5xl mx-auto px-4 pt-10 space-y-10">
        <div class="space-y-2">
            <p class="text-blue-400 text-sm font-bold tracking-widest uppercase">Now Playing</p>
            <h1 class="text-2xl md:text-3xl font-bold text-white">{{ lesson.title }}</h1>
        </div>

        <!-- 🔹 VIDEO SECTION -->
        <app-lessons-video-section [videoUrl]="lesson.videoUrl"></app-lessons-video-section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <!-- Left Side: Content -->
            <div class="lg:col-span-2 space-y-10">
                <!-- Lesson Info -->
                <app-lesson-description [lesson]="lesson"></app-lesson-description>

                <!-- Practice Task -->
                <app-lesson-task [lesson]="lesson"></app-lesson-task>
            </div>

            <!-- Right Side: Quiz -->
            <div class="space-y-6">
                <div class="bg-blue-600/5 border border-blue-500/10 rounded-2xl p-6 space-y-6 sticky top-24">
                    <div class="space-y-2">
                        <h2 class="text-lg font-bold text-white flex items-center gap-2">
                            <span>🧠</span> Quick Quiz
                        </h2>
                        <p class="text-slate-400 text-sm leading-relaxed">
                            {{ lesson.quiz.question }}
                        </p>
                    </div>

                    <div class="space-y-3">
                        <label *ngFor="let option of lesson.quiz.options"
                            class="flex items-center gap-3 p-4 rounded-xl border border-white/5 bg-white/[0.02] hover:bg-white/[0.05] hover:border-blue-500/30 cursor-pointer transition-all group">
                            <input type="radio" name="quiz" class="w-4 h-4 accent-blue-500">
                            <span class="text-slate-300 text-sm group-hover:text-white transition-colors">
                                {{ option }}
                            </span>
                        </label>
                    </div>

                    <button
                        class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm shadow-lg shadow-blue-500/20 transition-all active:scale-95">
                        Submit Answer
                    </button>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="flex justify-between items-center pt-10 border-t border-white/5">
            <button
                class="px-6 py-3 text-slate-400 hover:text-white transition-colors flex items-center gap-2 font-medium">
                <span>←</span> Previous
            </button>
            <button
                class="px-8 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm transition-all">
                Next Lesson <span>→</span>
            </button>
        </div>

    </div>
</div>
