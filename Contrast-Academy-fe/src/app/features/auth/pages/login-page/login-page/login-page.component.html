<div class="min-h-screen bg-neutral-900 flex flex-col">
    <!-- Centered Form -->
    <div class="flex-1 flex items-center justify-center px-4 sm:px-6 py-10">

        <div class="w-full max-w-md">

            <!-- Card -->
            <div class="relative bg-neutral-900/70 backdrop-blur-2xl 
      border border-white/10 rounded-2xl p-6 sm:p-8 
      shadow-[0_10px_40px_rgba(0,0,0,0.6)]">

                <!-- Glow -->
                <div class="absolute inset-0 rounded-2xl 
        bg-[radial-gradient(circle_at_top,rgba(59,130,246,0.15),transparent_60%)] pointer-events-none"></div>

                <!-- Header -->
                <div class="relative z-10 text-center mb-6">
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                        Welcome Back
                    </h2>
                    <p class="text-sm text-neutral-400 mt-2">
                        Login to continue your learning journey
                    </p>
                </div>

                <!-- Form -->
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="relative z-10 flex flex-col gap-4">

                    <div *ngIf="error" class="p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-500 text-xs text-center">
                        {{ error }}
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="text-xs text-neutral-400 font-semibold">Email</label>
                        <input type="email" formControlName="email" placeholder="Enter your email" class="mt-1 w-full px-4 py-2.5 rounded-xl bg-neutral-800/60 
              border border-white/10 text-white placeholder-neutral-500 
              focus:outline-none focus:ring-2 focus:ring-blue-500/40 
              focus:border-blue-500 transition-all" />
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="text-xs text-neutral-400 font-semibold">Password</label>
                        <input type="password" formControlName="password" placeholder="Enter your password" class="mt-1 w-full px-4 py-2.5 rounded-xl bg-neutral-800/60 
              border border-white/10 text-white placeholder-neutral-500 
              focus:outline-none focus:ring-2 focus:ring-blue-500/40 
              focus:border-blue-500 transition-all" />
                    </div>

                    <!-- Options -->
                    <div class="flex items-center justify-between text-xs text-neutral-400 mt-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" formControlName="rememberMe" class="accent-blue-500 w-4 h-4" />
                            Remember me
                        </label>

                        <a routerLink="/forgot-password" class="text-blue-400 hover:text-blue-300 font-semibold">
                            Forgot password?
                        </a>
                    </div>

                    <!-- Button -->
                    <button type="submit" [disabled]="loginForm.invalid || loading" class="mt-4 w-full py-2.5 rounded-xl font-bold text-white 
            bg-gradient-to-r from-blue-600 to-indigo-600 
            hover:from-blue-500 hover:to-indigo-500 
            transition-all shadow-lg shadow-blue-500/20 
            hover:shadow-blue-500/40 disabled:opacity-50 disabled:cursor-not-allowed">
                        {{ loading ? 'Logging in...' : 'Login' }}
                    </button>

                </form>

                <!-- Divider -->
                <div class="relative z-10 flex items-center my-6">
                    <div class="flex-1 h-px bg-white/10"></div>
                    <span class="px-3 text-xs text-neutral-500">OR</span>
                    <div class="flex-1 h-px bg-white/10"></div>
                </div>

                <!-- Social Login (Optional UI) -->
                <!-- <div class="relative z-10 flex gap-3">
                    <button class="flex-1 py-2.5 rounded-xl bg-white/5 border border-white/10 
          hover:bg-white/10 text-sm font-semibold text-white transition">
                        Google
                    </button>
                    <button class="flex-1 py-2.5 rounded-xl bg-white/5 border border-white/10 
          hover:bg-white/10 text-sm font-semibold text-white transition">
                        GitHub
                    </button>
                </div> -->

                <!-- Footer -->
                <div class="relative z-10 text-center mt-6 text-sm text-neutral-400">
                    Don’t have an account?
                    <a routerLink="/register" class="text-blue-400 hover:text-blue-300 font-semibold ml-1">
                        Sign up
                    </a>
                </div>

            </div>

        </div>

    </div>

</div>
