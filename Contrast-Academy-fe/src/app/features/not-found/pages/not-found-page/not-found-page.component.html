<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 via-gray-100 to-gray-200 px-4">

    <div class="relative text-center max-w-xl w-full">

        <!-- Glow background -->
        <div class="absolute inset-0 blur-3xl opacity-30 bg-blue-400 rounded-full"></div>

        <!-- Card -->
        <div class="relative bg-white/70 backdrop-blur-xl shadow-2xl rounded-3xl p-10 border border-gray-200">

            <!-- 404 Number -->
            <h1
                class="text-[120px] font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 tracking-tight">
                404
            </h1>

            <!-- Badge -->
            <div
                class="inline-block px-4 py-1 text-sm font-medium text-white bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full shadow-md -mt-6">
                Page Not Found
            </div>

            <!-- Message -->
            <p class="mt-6 text-gray-600 text-lg leading-relaxed">
                The page you're looking for might have been removed,
                renamed, or is temporarily unavailable.
            </p>

            <!-- Divider -->
            <div class="w-16 h-1 bg-gradient-to-r from-blue-500 to-indigo-500 mx-auto my-6 rounded-full"></div>

            <!-- Actions -->
            <div class="flex justify-center gap-4 flex-wrap">

                <a href="/"
                    class="px-6 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl shadow-lg hover:scale-105 hover:shadow-xl transition">
                    Go Home
                </a>

                <button onclick="history.back()"
                    class="px-6 py-2.5 border border-gray-300 rounded-xl text-gray-700 hover:bg-gray-100 transition">
                    Go Back
                </button>

            </div>

            <!-- Footer Note -->
            <p class="mt-6 text-sm text-gray-400">
                Error code: 404 • Resource not found
            </p>

        </div>

    </div>

</div>
