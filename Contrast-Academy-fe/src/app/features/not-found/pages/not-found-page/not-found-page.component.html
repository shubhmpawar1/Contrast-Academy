<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-100 to-gray-200 px-4">

    <div class="text-center">

        <!-- Big 404 -->
        <h1 class="text-9xl font-extrabold text-gray-800 tracking-widest">
            404
        </h1>

        <!-- Floating badge -->
        <div class="bg-blue-600 text-white text-sm px-4 py-1 rounded-full inline-block -mt-6 shadow">
            Page Not Found
        </div>

        <!-- Message -->
        <p class="mt-6 text-gray-600 text-lg max-w-md mx-auto">
            The page you're looking for doesn’t exist or has been moved.
            Let’s get you back on track.
        </p>

        <!-- Buttons -->
        <div class="mt-6 flex justify-center gap-4">

            <a href="/" class="px-5 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition">
                Go Home
            </a>

            <button onclick="history.back()"
                class="px-5 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition">
                Go Back
            </button>

        </div>

        <!-- Decorative element -->
        <div class="mt-10">
            <svg class="w-64 mx-auto opacity-40" viewBox="0 0 200 200" fill="none">
                <circle cx="100" cy="100" r="80" stroke="#3B82F6" stroke-width="4" stroke-dasharray="6 10" />
            </svg>
        </div>

    </div>

</div>
