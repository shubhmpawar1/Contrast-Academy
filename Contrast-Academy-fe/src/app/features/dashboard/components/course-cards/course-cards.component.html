<div class="max-w-7xl mx-auto p-6">

    <h2 class="text-xl font-semibold text-black dark:text-white mb-6">
        Your Courses
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <div *ngFor="let course of courses" class="rounded-2xl border border-black/10 bg-white p-6
                shadow-sm transition-all duration-300
                hover:shadow-md hover:-translate-y-1
                dark:bg-black dark:border-white/10">

            <!-- Course Name -->
            <h3 class="text-lg font-semibold text-black dark:text-white">
                {{ course.name }}
            </h3>

            <!-- Progress Text -->
            <div class="mt-2 flex justify-between text-sm text-black/60 dark:text-white/60">
                <span>{{ course.completed }}/{{ course.total }} Lessons</span>
                <span>{{ course.progress }}%</span>
            </div>

            <!-- Progress Bar -->
            <div class="w-full h-2 bg-black/10 rounded-full mt-2 overflow-hidden dark:bg-white/10">
                <div class="h-full bg-black dark:bg-white transition-all duration-500"
                    [style.width.%]="course.progress">
                </div>
            </div>

            <!-- Details -->
            <div class="mt-4 space-y-1 text-sm text-black/70 dark:text-white/70">
                <p>📘 Current: {{ course.currentLesson }}</p>
                <p>📝 Pending Tasks: {{ course.pendingTasks }}</p>
            </div>

            <!-- Action -->
            <button class="mt-5 w-full py-2 text-sm font-medium rounded-lg
                     border border-black/10 hover:bg-black hover:text-white
                     transition-all duration-300
                     dark:border-white/20 dark:hover:bg-white dark:hover:text-black">
                Continue Learning
            </button>

        </div>

    </div>
</div>
