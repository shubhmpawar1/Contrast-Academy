<nav class="sticky top-0 z-50 w-full 
bg-gradient-to-b from-neutral-900/80 to-neutral-900/60 
backdrop-blur-2xl border-b border-white/10 
px-4 sm:px-8 py-3 flex flex-wrap items-center justify-between 
shadow-[0_10px_40px_rgba(0,0,0,0.6)] gap-4 transition-all duration-300">

    <!-- Glow Overlay -->
    <div class="pointer-events-none absolute inset-0 
    bg-[radial-gradient(circle_at_top,rgba(59,130,246,0.15),transparent_60%)]"></div>

    <!-- Logo -->
    <a routerLink="/" class="relative z-10 group flex items-center gap-3 shrink-0 cursor-pointer">
        <div class="h-9 w-9 bg-white/90 rounded-xl 
        shadow-[0_0_20px_rgba(255,255,255,0.15)] 
        border border-white/20 flex items-center justify-center p-1.5 
        group-hover:scale-105 group-hover:shadow-[0_0_25px_rgba(255,255,255,0.25)] transition-all">
            <img src="assets/logo/logo.jpg" class="h-full w-full object-contain rounded-md" />
        </div>

        <span class="text-lg sm:text-xl font-extrabold 
        text-transparent bg-clip-text bg-gradient-to-r from-white to-neutral-400 
        tracking-tight hidden sm:block group-hover:tracking-wide transition-all">
            Contrast Academy
        </span>
    </a>

    <!-- Navigation -->
    <div class="relative z-10 flex items-center gap-2 flex-wrap order-3 w-full md:w-auto md:order-2">

        <!-- Nav Link -->
        <a routerLink="/dashboard" routerLinkActive="!bg-white/15 !text-white shadow-lg" class="px-5 py-2.5 rounded-full text-neutral-400 
           hover:text-white hover:bg-white/5 
           transition-all duration-300 text-sm font-semibold tracking-wide 
           relative overflow-hidden group">

            <span class="relative z-10">Dashboard</span>

            <!-- Hover Glow -->
            <span class="absolute inset-0 opacity-0 group-hover:opacity-100 
            bg-gradient-to-r from-blue-500/10 to-transparent transition"></span>
        </a>

        <!-- Courses Dropdown -->
        <div class="relative group">

            <a routerLink="/courses" class="px-5 py-2.5 rounded-full text-neutral-400 
               hover:text-white hover:bg-white/5 
               transition-all duration-300 text-sm font-semibold 
               tracking-wide flex items-center gap-1">

                Courses
                <svg class="w-4 h-4 transition-transform group-hover:-rotate-180 opacity-70 group-hover:opacity-100"
                    fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M5.22 8.22a.75.75 0 011.06 0L10 11.94l3.72-3.72a.75.75 0 111.06 1.06l-4.25 4.25a.75.75 0 01-1.06 0L5.22 9.28a.75.75 0 010-1.06z"
                        clip-rule="evenodd" />
                </svg>
            </a>

            <!-- Dropdown -->
            <div class="absolute left-0 top-full mt-3 w-56 
            rounded-2xl bg-neutral-900/90 backdrop-blur-xl 
            border border-white/10 
            shadow-[0_10px_40px_rgba(0,0,0,0.6)] 
            opacity-0 invisible translate-y-3 
            group-hover:opacity-100 group-hover:visible group-hover:translate-y-0 
            transition-all duration-300 z-[100] p-2">

                <a *ngFor="let course of courses" [routerLink]="['/course', course.id]" class="px-4 py-3 text-sm font-semibold text-neutral-400 
                   hover:text-white hover:bg-white/5 
                   rounded-xl transition-all flex items-center gap-3 group">

                    <span class="text-lg group-hover:scale-110 transition">
                        {{ course.icon }}
                    </span>

                    <span>
                        {{ course.title }}
                    </span>
                </a>
            </div>
        </div>

        <a routerLink="/resources" class="px-5 py-2.5 rounded-full text-neutral-400 
           hover:text-white hover:bg-white/5 
           transition-all duration-300 text-sm font-semibold tracking-wide">
            Resources
        </a>

        <a routerLink="/course-assign" routerLinkActive="!bg-white/15 !text-white shadow-lg" class="px-5 py-2.5 rounded-full text-neutral-400 
           hover:text-white hover:bg-white/5 
           transition-all duration-300 text-sm font-semibold tracking-wide 
           relative overflow-hidden group">
            Assign Course
        </a>
    </div>

    <!-- Right Section -->
    <div class="relative z-10 flex items-center gap-4 order-2 md:order-3">

        <!-- Notification -->
        <button class="relative p-2.5 text-neutral-400 
        hover:text-white hover:bg-white/10 
        rounded-full transition-all duration-300 hidden sm:block">

            <div class="absolute top-2 right-2 w-2.5 h-2.5 
            bg-rose-500 rounded-full border-2 border-neutral-900 
            shadow-[0_0_10px_rgba(244,63,94,0.7)] animate-pulse"></div>

            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
            </svg>
        </button>

        <!-- Profile -->
        <button class="group flex items-center gap-3 p-1.5 pr-4 rounded-full 
        hover:bg-white/5 transition-all border border-transparent hover:border-white/10">

            <div class="relative">
                <img src="assets/profile/Shubham Pawar.jpg" class="w-9 h-9 rounded-full object-cover 
                     border border-white/20 shadow-[0_0_15px_rgba(255,255,255,0.15)]" />

                <div class="absolute bottom-0 right-0 w-3 h-3 
                bg-green-500 rounded-full border-2 border-neutral-900 
                shadow-[0_0_8px_rgba(34,197,94,0.7)]"></div>
            </div>

            <div class="flex flex-col leading-none text-left min-w-[60px]">
                <span class="text-sm font-bold text-white whitespace-nowrap">
                    {{ currentUser?.name || 'Guest User' }}
                </span>
                <span class="text-[10px] font-semibold text-blue-400 uppercase hidden sm:block">
                    {{ currentUser ? 'Student' : 'Visitor' }}
                </span>
            </div>
        </button>

    </div>

</nav>
